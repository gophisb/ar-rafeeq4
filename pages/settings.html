<section class="page settings-page" dir="rtl">
  <header class="hero"><h1>الإعدادات</h1><p>خصص الرفيق بما يناسبك، وتبقى خياراتك محفوظة على جهازك.</p></header>
  <section class="card settings-card">
    <label for="themeSelect">المظهر</label><select id="themeSelect" class="input"><option value="dark">داكن</option><option value="light">فاتح</option></select>

    <button id="requestNotifications" class="btn primary" type="button">طلب إذن التنبيهات</button>
    <p id="settingsStatus" class="muted" role="status"></p>
  </section>
</section>
