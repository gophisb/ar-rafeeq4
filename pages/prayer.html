<section class="page prayer-page" dir="rtl">
  <header class="hero">
    <h1>مواقيت الصلاة</h1>
    <p>حساب محلي لمواقيت الفجر والشروق والظهر والعصر والمغرب والعشاء.</p>
  </header>
  <section class="card prayer-controls">
    <label for="wilayaSelect">الولاية / الموقع اليدوي</label>
    <select id="wilayaSelect" class="input"></select>
    <div class="button-row"><button id="useWilaya" class="btn primary" type="button">استخدام الولاية</button><button id="useGps" class="btn" type="button">استخدام GPS</button></div>
    <p id="prayerLocationStatus" class="muted" role="status"></p>
  </section>
  <section class="card next-prayer-card">
    <span class="muted">الوقت الحالي</span><h2 id="currentTime">--:--:--</h2>
    <span class="muted">الصلاة القادمة</span><h2 id="nextPrayerName">—</h2><strong id="countdown">--:--:--</strong><p id="nextPrayerTime"></p>
  </section>
  <section id="prayerTimesList" class="stack" aria-live="polite"></section>
  <section class="card adhan-card">
    <h2>الأذان</h2>
    <p id="adhanStatus" class="muted" role="status">التشغيل متوقف حتى تفعّله من الإعدادات.</p>
    <audio id="adhanAudio" preload="metadata" src="./assets/audio/adhan.mp3"></audio>
    <button id="testAdhan" class="btn" type="button">تجربة الأذان</button>
  </section>
</section>
<script src="./pages/prayer.js"></script>
