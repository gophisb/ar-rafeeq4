<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <!-- ======================================================
         المعلومات الأساسية
    ======================================================= -->

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   viewport-fit=cover">

    <title>الرفيق | Al-Rafeeq</title>

    <meta name="description"
          content="الرفيق - تطبيق إسلامي متكامل للقرآن الكريم، التفسير، الأذكار، مواقيت الصلاة، القبلة، والأربعين النووية.">

    <meta name="theme-color"
          content="#0B1220">

    <meta name="color-scheme"
          content="dark light">

    <meta name="application-name"
          content="الرفيق">


    <!-- ======================================================
         PWA
    ======================================================= -->

    <link rel="manifest"
          href="manifest.json">

    <link rel="icon"
          href="assets/icons/favicon.svg"
          type="image/svg+xml">

    <link rel="apple-touch-icon"
          href="assets/icons/icon-192.png">


    <!-- ======================================================
         CSS
    ======================================================= -->

    <link rel="stylesheet"
          href="styles.css">


    <!-- ======================================================
         JavaScript
         الترتيب:
         1. config.js
         2. router.js
         3. app.js
    ======================================================= -->

    <script src="config.js" defer></script>

    <script src="router.js" defer></script>

    <script src="app.js" defer></script>

</head>


<body>

    <!-- ======================================================
         رابط الوصول السريع
    ======================================================= -->

    <a class="skip-link"
       href="#main-content">

        الانتقال إلى المحتوى

    </a>


    <!-- ======================================================
         التطبيق
    ======================================================= -->

    <div id="app">


        <!-- ==================================================
             Header
        =================================================== -->

        <header id="app-header">
        </header>


        <!-- ==================================================
             Main Content
        =================================================== -->

        <main id="main-content">
        </main>


        <!-- ==================================================
             Bottom Navigation
        =================================================== -->

        <nav id="bottom-navigation"
             aria-label="التنقل الرئيسي">
        </nav>


        <!-- ==================================================
             Dialog Root
        =================================================== -->

        <div id="dialog-root">
        </div>


        <!-- ==================================================
             Toast Root
        =================================================== -->

        <div id="toast-root"
             aria-live="polite"
             aria-atomic="true">
        </div>


        <!-- ==================================================
             Loader Root
        =================================================== -->

        <div id="loader-root"
             aria-live="polite"
             aria-busy="false">
        </div>


        <!-- ==================================================
             Offline Banner
        =================================================== -->

        <div id="offline-banner">
        </div>


    </div>

</body>

</html>
