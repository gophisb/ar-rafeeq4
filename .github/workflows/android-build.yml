name: Android APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - offline-apk-safe
      - feat/algeria-certified-prayer-times

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: npm run prepare:web

      - name: Add Android project
        run: npx cap add android

      - name: Apply existing golden mosque launcher icon
        run: |
          set -eu
          command -v convert >/dev/null
          for spec in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            density="${spec%%:*}"
            size="${spec##*:}"
            dir="android/app/src/main/res/mipmap-${density}"
            test -d "$dir"
            convert assets/icons/icon-512.png -resize "${size}x${size}" "$dir/ic_launcher.png"
            convert assets/icons/icon-512.png -resize "${size}x${size}" "$dir/ic_launcher_round.png"
            convert assets/icons/icon-512.png -resize "${size}x${size}" "$dir/ic_launcher_foreground.png"
          done
          for xml in android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml; do
            if [ -f "$xml" ]; then
              sed -i 's/@drawable\/ic_launcher_foreground/@mipmap\/ic_launcher_foreground/g' "$xml"
            fi
          done
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
          test -s android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png

      - name: Install native locked-screen adhan
        run: node scripts/install-android-adhan.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ar-rafeeq4-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
