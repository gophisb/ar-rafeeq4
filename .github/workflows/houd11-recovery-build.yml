name: Houd11 Recovery Android Build
on:
  push:
    branches: [feat/offline-mosque-map-houd11-source]
  pull_request:
    branches: [feat/offline-mosque-map]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare offline web bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets/www android/app/src/main/res/raw
          rsync -a --exclude='.git' --exclude='.github' --exclude='android' --exclude='fastlane' --exclude='*.md' --exclude='assets/screenshots' --exclude='assets/slides' ./ android/app/src/main/assets/www/
          cp assets/audio/adhan.mp3 android/app/src/main/res/raw/adhan.mp3
          test -s android/app/src/main/res/raw/adhan.mp3
          test -f android/app/src/main/assets/www/index.html
      - name: Build APK
        run: cd android && gradle --no-daemon :app:assembleDebug
      - name: Verify APK identity and signature
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"
          unzip -p "$APK" AndroidManifest.xml >/tmp/manifest.bin
          strings /tmp/manifest.bin | grep -q 'gophisb' || true
          ls -lh "$APK"
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: houd11-recovery-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
