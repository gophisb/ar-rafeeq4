name: Houd11 Android Offline APK

on:
  push:
    branches: [houd11-android-offline, feat/offline-mosque-map-v2, feat/offline-algeria-map-bundled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare pinned offline mosque dataset
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/prepare_mosque_data.py
          test -s pages/mosquees-data.json

      - name: Fetch official Algeria Mapsforge map
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets/maps
          curl -fL --retry 4 --retry-all-errors --connect-timeout 30 --max-time 1800 \
            "https://download.mapsforge.org/maps/v5/africa/algeria.map" \
            -o android/app/src/main/assets/maps/algeria.map
          test -s android/app/src/main/assets/maps/algeria.map
          SIZE=$(stat -c%s android/app/src/main/assets/maps/algeria.map)
          echo "Algeria map bytes: $SIZE"
          test "$SIZE" -ge 250000000
          sha256sum android/app/src/main/assets/maps/algeria.map | tee algeria-map.sha256
          test -s algeria-map.sha256

      - name: Prepare offline web bundle
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets/www android/app/src/main/res/raw
          rsync -a --exclude='.git' --exclude='.github' --exclude='android' --exclude='fastlane' --exclude='*.md' --exclude='assets/screenshots' --exclude='assets/slides' ./ android/app/src/main/assets/www/
          cp assets/audio/adhan.mp3 android/app/src/main/res/raw/adhan.mp3
          test -s android/app/src/main/res/raw/adhan.mp3
          test -f android/app/src/main/assets/www/index.html
      - name: Build signed debug APK
        run: cd android && gradle --no-daemon :app:assembleDebug
      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"
          ls -lh "$APK"
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: houd11-android-debug-signed
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
