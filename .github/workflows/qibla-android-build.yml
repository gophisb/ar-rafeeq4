name: Al-Rafeeq Al-Jazairi Android APK Build

on:
  push:
    branches:
      - feat/qibla-android-build
      - fix/rafeeq-algeria-quran-native-haptics-2026-11-15
      - feat/rafeeq4-official-icon-apk
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install

      - name: Verify bundled Algeria prayer engine
        run: npm run test:prayer-bundle

      - name: Prepare web assets
        run: npm run prepare:web

      - name: Add Android project
        run: npx cap add android

      - name: Apply official Rafeeq launcher icon
        run: |
          python -m pip install --user Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import shutil
          source = Image.open('assets/icons/launcher-icon-128.png').convert('RGBA')
          res = Path('android/app/src/main/res')
          density_sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }
          for folder, size in density_sizes.items():
              target = res / folder
              target.mkdir(parents=True, exist_ok=True)
              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(target / 'ic_launcher.png', optimize=True)
              icon.save(target / 'ic_launcher_round.png', optimize=True)
          adaptive = res / 'mipmap-anydpi-v26'
          for name in ('ic_launcher.xml', 'ic_launcher_round.xml'):
              p = adaptive / name
              if p.exists():
                  p.unlink()
          print('Launcher icon replaced in all Android density buckets.')
          PY

      - name: Install native adhan layer
        run: node scripts/install-android-adhan.mjs

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK"
          ls -lh "$APK"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ar-rafeeq4-official-icon-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
