version: "1"
purpose: "Maintain Ar-Rafeeq 4 as a stable offline-first Islamic application under RAECS governance"
allowed_paths:
  - "app.js"
  - "prayer.js"
  - "prayer-engine.js"
  - "router.js"
  - "pages/"
  - "js/"
  - "assets/"
  - "styles.css"
  - "variables.css"
  - "manifest.json"
  - "sw.js"
  - "native-bridge.js"
  - "capacitor.config.json"
  - "README.md"
  - "RUNBOOK.md"
  - "EVALS/"
  - "DECISIONS/"
  - "OPLOG/"
  - "scripts/"
  - "RAECS_EXECUTABLES_ALLOWLIST.txt"
forbidden_actions:
  - "execute unreviewed downloaded code"
  - "exfiltrate secrets or private data"
  - "modify governance boundaries without human approval"
  - "disable or bypass a mandatory gate"
  - "remove or alter protected Islamic content without review"
requires_human_approval:
  - "governance changes"
  - "security-boundary changes"
  - "production release"
