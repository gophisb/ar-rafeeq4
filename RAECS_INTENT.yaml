version: "2"
purpose: "Operate and evolve Ar-Rafeeq 4 under the RAFEEQ Engineering Constitution V3 while preserving working application behavior"
allowed_paths:
  - "app.js"
  - "prayer.js"
  - "prayer-engine.js"
  - "router.js"
  - "pages/"
  - "js/"
  - "assets/"
  - "styles.css"
  - "variables.css"
  - "manifest.json"
  - "sw.js"
  - "native-bridge.js"
  - "capacitor.config.json"
  - "android/"
  - "README.md"
  - "ARCHITECTURE.md"
  - "REQUIREMENTS.md"
  - "CHANGELOG.md"
  - "RUNBOOK.md"
  - "RAFEEQ_CONSTITUTION.md"
  - "RAECS_POLICY.yaml"
  - "RAECS_INTENT.yaml"
  - "PROJECT_STATE.md"
  - "TASK_LEDGER.md"
  - "EVALS/"
  - "DECISIONS/"
  - "OPLOG/"
  - "scripts/"
  - "RAECS_EXECUTABLES_ALLOWLIST.txt"
  - "RAECS_ROLES.yaml"
forbidden_actions:
  - "execute unreviewed downloaded code"
  - "exfiltrate secrets or private data"
  - "modify governance boundaries without human approval"
  - "disable or bypass a mandatory gate"
  - "silently broaden task scope"
  - "delete or silently replace protected Islamic content"
requires_human_approval:
  - "governance changes"
  - "security-boundary changes"
  - "permission expansion"
  - "production release"
  - "destructive operations"
  - "changes to prayer/adhan/qibla behavior"
